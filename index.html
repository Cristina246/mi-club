<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Colibrí</title>
    <style>
        body { 
            font-family: sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            padding: 0; 
            background-color: #f5f6fa; 
            scroll-behavior: smooth; 
            display: flex; 
        }
        
        .sidebar {
            width: 230px;
            background: #111111;
            color: white;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }
        
        .sidebar img.logo {
            width: 140px; 
            height: auto;
            margin-bottom: 20px;
        }

        .sidebar h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #d4af37;
        }

        .nav-links { 
            display: flex; 
            flex-direction: column; 
            width: 100%;
        }
        
        .nav-links a { 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 1.05rem; 
            padding: 15px 20px; 
            text-align: left;
            border-bottom: 1px solid #333;
            transition: background 0.3s;
        }
        
        .nav-links a:hover { 
            background: #333333;
            color: #d4af37; 
        }

        .main-content {
            margin-left: 230px; 
            width: calc(100% - 230px);
        }

        h2.section-title { color: #1a1a1a; margin-bottom: 20px; text-align: center; font-size: 2.2rem; }
        .gallery { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; padding: 20px; }
        .gallery-item { text-align: center; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 160px; }
        .gallery img { width: 140px; height: 140px; object-fit: cover; border-radius: 6px; }
        .gallery-item p { font-size: 0.85rem; margin: 8px 0 0 0; color: #333; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 8px; margin-bottom: 15px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .video-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .video-card h3 { margin-top: 0; font-size: 1.2rem; color: #333; text-align: center; min-height: 40px; }
        .btn-donar { display: inline-block; background-color: #ff9f43; color: white; padding: 15px 35px; text-decoration: none; font-weight: bold; border-radius: 30px; font-size: 1.2rem; margin-top: 15px; }
        .btn-donar:hover { background-color: #ee5253; }
        footer { background: #111; color: #fff; text-align: center; padding: 15px 0; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <!-- Asegúrate de subir tu logo transparente con este nombre: logo.png -->
        <img src="logo.png" alt="Logo Club Colibrí" class="logo">
        <h2>Club Colibrí</h2>
        
        <nav class="nav-links">
            <a href="#inicio">Inicio</a>
            <a href="#quienes-somos">¿Quiénes somos?</a>
            <a href="#presentacion">Presentación</a>
            <a href="#museo">Museo Digital</a>
            <a href="#clases">Clases</a>
            <a href="#proximas-clases">Próximas Clases</a>
            <a href="#tienda">Tienda</a>
            <a href="#contacto">Contacto</a>
            <a href="#donaciones">Donaciones</a>
        </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
